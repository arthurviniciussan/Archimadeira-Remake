<section>
        <div class="login">
            <h1>Acesse sua conta</h1>
            <p>Informe seu e-mail e senha para ter acesso à sua conta.</p>
        </div>
   
            <form class="login-form">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" autocomplete="email" placeholder="seu.email@exemplo.com">

                <div class="login-senha">
                    <label for="senha">Senha</label><a href="#">Esqueci minha senha</a>
                </div>
                <input type="password" name="senha" id="senha" autocomplete="current-password" placeholder="Senha Cadastrada">
                <button type="submit">Entrar</button>
            </form>
            
            
            <div class="login-footer">
                <p>Ainda não é cadastrado? <a href="#">Cadastre-se</a></p>
            </div>
       
    </section>
